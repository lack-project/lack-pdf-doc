<style>{{css}}</style>
<div class="page">
    <div class="logo"><img src="image:{{logo}}" alt=""></div>
    <div class="header-extra">{{header}}</div>
    <div class="address-window">
        <div class="sender">{{sender}}</div>
        <div class="recipient">{{recipient}}</div>
    </div>
    <main class="document">{{content}}</main>
    <footer class="first-page-footer">
        <table><tr>
            <td>{{footerAddress}}</td><td>{{footerBank}}</td><td>{{footerContact}}</td><td>{{footerExtra}}</td>
        </tr></table>
    </footer>
</div>

<style>{{css}}</style>
<div class="page">
    <div class="logo"><img src="{{logo}}" alt=""></div>
    <div class="reference-block">{{referenceBlock}}</div>
    <div class="address-window">
        <div class="return-address">{{returnAddress}}</div>
        <div class="recipient-address">{{recipientAddress}}</div>
    </div>
    <main class="document">{{content}}</main>
    <footer class="first-page-footer">
        <table><tr>
            <td>{{footerCompany}}</td><td>{{footerBank}}</td><td>{{footerContact}}</td><td>{{footerLegal}}</td>
        </tr></table>
    </footer>
</div>
